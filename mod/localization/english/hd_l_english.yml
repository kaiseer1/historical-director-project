l_english:

 # CK3 localization is strictly one entry per line. A quoted string that runs
 # onto a second physical line is not a continuation - the reader treats the
 # next line as a new entry, finds no colon, and reports
 # "Missing colon (:) separator". Three of the entries below used to wrap, which
 # is why error.log carried three of those and why hd_event.0100 through 0102
 # had no readable description. Paragraph breaks are \n\n, never a real newline.

 hd_event.0001.t:0 "The Historical Director"
 hd_event.0001.desc:0 "A chronicler has taken up residence in your court. [ROOT.Char.GetFirstNameNoTooltip] will find that nothing now passes unremarked: births and deaths, borders redrawn, houses risen and fallen. The Director keeps the record, and will speak when the world begins to stray from it.\n\nYou remain the judge of what is done about it."
 hd_event.0001.a:0 "Let the record be kept."

 hd_event.0002.t:0 "The Director Would Speak"
 hd_event.0002.desc:0 "The chronicler sets down a page and waits. Something in the world no longer matches the history it was meant to follow, and there is a case to be made for setting it right.\n\nThe argument, and the evidence behind it, await your judgement in the Director's ledger."
 hd_event.0002.a:0 "Read the argument."

 hd_rearm_director_decision:0 "Recall the Historical Director"
 hd_rearm_director_decision_desc:0 "The Director's attention does not survive the loading of a save. Recall them, and the watch resumes."
 hd_rearm_director_decision_tooltip:0 "Restart the Historical Director's watch over the world."
 hd_rearm_director_decision_confirm:0 "Recall them."

 hd_event.0100.t:0 "A Message Across the Water"
 hd_event.0100.desc:0 "A ship puts in with a letter and no envoy willing to wait for an answer. Across the water, [scope:hd_across_water.GetTitledFirstNameNicknamedNoTooltipRegnal] is pressed on all sides, and there are those in that country who would rather be ruled from here than by the neighbours currently deciding the matter.\n\nIt would not be the first time a quarrel across a strait became an inheritance."
 hd_event.0100.a:0 "Their quarrel is our opportunity."
 hd_event.0100.b:0 "Let them settle it themselves."

 hd_event.0101.t:0 "The Crossing"
 hd_event.0101.desc:0 "They have asked us to come. [scope:hd_supplicant.GetTitledFirstNameNicknamedNoTooltipRegnal] holds land that [scope:hd_supplicant.GetHerHim] can no longer defend, and shares our faith, and would rather be defended by us than taken by anyone else.\n\nThe scholars are already uneasy. A host invited across water has seldom been easy to send home again, and those who issue such invitations rarely enjoy the result."
 hd_event.0101.a:0 "We will cross. What follows, follows."
 hd_event.0101.b:0 "Send aid, not an army."

 hd_event.0102.t:0 "A Plea for Protection"
 hd_event.0102.desc:0 "[scope:hd_petitioner.GetTitledFirstNameNicknamedNoTooltipRegnal] has lost ground and come to us rather than to the victor. The request is for protection. The unspoken part is that protection, offered long enough, becomes something else.\n\nWe may take them under our care, and understand what that means. Or we may simply help them, and let them remain themselves."
 hd_event.0102.a:0 "Take them under our protection."
 hd_event.0102.b:0 "Help them stand on their own."

 hd_iberian_pressure_smoldering:0 "Iberian Pressure: Smoldering"
 hd_iberian_pressure_fervent:0 "Iberian Pressure: Fervent"
 hd_iberian_pressure_crusade:0 "Iberian Pressure: A Crusading Temper"
 hd_iberian_pressure_truce:0 "Iberian Accord"

 hd_event.0200.t:0 "The Peninsula Draws Together"
 hd_event.0200.desc:0 "Envoys have been arriving all season, and none of them says the word aloud. Every court in the peninsula has reached the same arithmetic independently: alone, none of them can finish what is in front of them, and together the question is only who leads.\n\nNothing has been promised. Accords could be sworn, arms shared, and the matter of who inherits from whom left to settle itself in the usual way. Or the season could pass, as seasons do."
 hd_event.0200.a:0 "Let the accords be sworn."
 hd_event.0200.b:0 "The peninsula can wait."

 hd_event.0201.t:0 "A Question of Inheritance"
 hd_event.0201.desc:0 "The accords have held longer than anyone expected, and the lawyers have been busy. There is a case - not a strong one, but a case - that [scope:hd_partner_1.GetTitledFirstNameNicknamedNoTooltipRegnal]'s title should have come to this house, and enough of the peninsula now owes us enough that the case would be heard.\n\nPressing it would mean war eventually. Letting it lie would mean the argument is never made again."
 hd_event.0201.a:0 "Press the claim."
 hd_event.0201.b:0 "Let it lie."

 hd_press_iberian_union_decision:0 "Press the Union"
 hd_press_iberian_union_decision_desc:0 "The accords sworn during the pressure gave this house standing it did not have before. Standing can be spent. A claim pressed now against a neighbour would be heard, where a year ago it would have been laughed at."
 hd_press_iberian_union_decision_tooltip:0 "Gain a pressed claim on a neighbouring ruler's primary title."
 hd_press_iberian_union_decision_confirm:0 "Let the lawyers begin."

 hd_moment_union:0 "A Crown Drawing Together"
 hd_moment_decline:0 "A Power Coming Apart"

 hd_event.0210.t:0 "The Question of the Two Crowns"
 hd_event.0210.desc:0 "The lawyers have finished, and what they have produced is not a conquest but a genealogy. Set out on the table, the descents run together often enough that the two crowns have a case for being one crown that was carelessly divided.\n\nThe case will not argue itself, and the other court will not concede it. But the argument now exists, it is written down, and there is money enough to put an army behind it if it comes to that."
 hd_event.0210.a:0 "Then let it be heard."

 hd_event.0211.t:0 "The Cracks Run Deep"
 hd_event.0211.desc:0 "Word comes from the south faster than it can be checked, and all of it says the same thing. Garrisons unpaid, governors ruling in their own names, tax that leaves a province and never arrives. Whatever held that power together is not holding it any more.\n\nWhat is coming apart down there will be divided by whoever is standing closest when it finishes. We are standing close."
 hd_event.0211.a:0 "Then we had better be ready."
